name: dermalens
description: On-device skin screening, local assistant, and medicine store.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  permission_handler: ^12.0.1
  image: ^4.5.4
  shared_preferences: ^2.5.3
  provider: ^6.1.5
  onnxruntime: ^1.4.1
  path_provider: ^2.1.5
  path: ^1.9.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/skin_efficientnet_b4.onnx
    - assets/models/best_efficientnet_b4.pth
    - assets/models/branding/dermalens_logo.png
    - assets/products/
    - assets/doctors/
